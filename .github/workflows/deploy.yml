name: Deploy Backend to Hostinger VPS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias del monorepo
        run: npm install

      - name: Compilar Backend
        run: npm run build --workspace=@lawyer/server

      - name: Subir artefacto compilado
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: apps/server/dist/

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Descargar artefacto compilado
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Configurar SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Crear estructura de carpetas en VPS
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "mkdir -p /var/www/lawyer-api"

      - name: Subir archivos autocontenidos al VPS via rsync
        run: |
          # Subir el contenido de dist/ (que incluye server.js, package.json, prisma, etc.)
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/lawyer-api/

      - name: Instalar dependencias de producción y reiniciar PM2
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /var/www/lawyer-api \
            && rm -rf node_modules \
            && npm install --omit=dev \
            && pm2 restart lawyer-backend 2>/dev/null || pm2 start server.js --name "lawyer-backend" \
            && pm2 save \
            && echo 'Backend de Lawyer CRM desplegado con éxito!'"
